name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / Postgres ${{ matrix.postgres }})

    # The floor (what `mix.exs` allows and local dev runs, on Postgres 17) and
    # the latest release (what the Docker image ships, on Postgres 18). Coverage is uploaded once, from
    # the latest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18'
            otp: '25'
            postgres: '17'
          - elixir: '1.20.5'
            otp: '29.1.2'
            postgres: '18'
            latest: true

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: distributed_task_queue_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Keyed by version: _build from one Elixir/OTP must not be reused by another.
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Run tests with coverage
        run: mix coveralls.json
        env:
          MIX_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost/distributed_task_queue_test

      - name: Upload coverage to Codecov
        if: matrix.latest
        uses: codecov/codecov-action@v7
        with:
          files: ./cover/excoveralls.json
          flags: unittests
          fail_ci_if_error: false

      - name: Run Credo (linting)
        run: mix credo suggest
        env:
          MIX_ENV: test

      # - name: Run Dialyzer (type checking)
      #   run: mix dialyzer
      #   env:
      #     MIX_ENV: test